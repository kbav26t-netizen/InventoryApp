name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar
        run: |
          curl -L "https://api.github.com/repos/gradle/gradle/contents/gradle/wrapper/gradle-wrapper.jar?ref=v8.6.0" \
            -H "Accept: application/vnd.github.v3.raw" \
            -o gradle/wrapper/gradle-wrapper.jar
          SIZE=$(stat -c%s gradle/wrapper/gradle-wrapper.jar)
          echo "Wrapper JAR size: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "ERROR: gradle-wrapper.jar is too small ($SIZE bytes)"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
